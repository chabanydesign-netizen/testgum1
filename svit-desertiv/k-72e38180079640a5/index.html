<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Світ десертів · Chabany Design</title>
<link rel="icon" href="img/mark.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
:root{--cream:#EEE7DD; --sand:#EAE3D9; --ink:#2E2925; --terra:#C07B5A;}
html,body{margin:0; height:100%; background:#14110F; overflow:hidden;}
*{box-sizing:border-box;}
body{font-family:'Didact Gothic','Century Gothic',Arial,sans-serif; color:var(--cream);}
#stage{position:fixed; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0;}
#stage>section{position:absolute; inset:0; overflow:hidden; opacity:0; visibility:hidden; transition:opacity .7s ease, visibility 0s .7s;}
#stage>section.active{opacity:1; visibility:visible; transition:opacity .7s ease;}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; margin:0;}
.eyebrow{margin:0; font-size:17px; letter-spacing:6px; text-transform:uppercase;}
.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.active .bg{animation:kb 12s ease-out both;}
.cover{background:var(--ink);}
.shade-l{position:absolute; inset:0; background:linear-gradient(90deg,rgba(24,20,17,.92) 0%,rgba(24,20,17,.75) 38%,rgba(24,20,17,0) 70%);}
.cover .eyebrow{position:absolute; left:110px; top:130px; color:#E2D8CC;}
.cover h1{position:absolute; left:104px; top:330px; font-size:150px; line-height:1; color:#FAF6F0;}
.cover .sub{position:absolute; left:112px; top:520px; margin:0; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:38px; color:#E2D8CC;}
.cover .rule{position:absolute; left:112px; top:612px; width:100px; height:3px; background:var(--terra);}
.cover .facts{position:absolute; left:112px; top:640px; margin:0; font-size:17px; letter-spacing:6px; color:#E2D8CC;}
.cover .logo{position:absolute; left:110px; bottom:84px; width:210px;}
.view{background:#1B1714;}
.shade-b{position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,16,13,0) 55%,rgba(20,16,13,.78) 100%);}
.view .eyebrow{position:absolute; left:100px; bottom:150px; color:#ECE4DA;}
.view h2{position:absolute; left:96px; bottom:66px; font-size:58px; color:#FAF6F0;}
.view .no{position:absolute; right:100px; bottom:76px; margin:0; font-size:15px; letter-spacing:4px; color:#ECE4DA;}
.view .logo-s{position:absolute; right:100px; top:120px; width:150px;}
.sheet{background:var(--sand);}
.pg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
.active .pg{animation:sheet 1.1s cubic-bezier(.2,.7,.2,1) both;}
.active .a1{animation:up .9s ease-out .25s both;} .active .a2{animation:up .9s ease-out .45s both;}
.active .a3{animation:up .9s ease-out .65s both;} .active .a4{animation:up .9s ease-out .85s both;}
@keyframes kb{from{transform:scale(1.08);}to{transform:scale(1);}}
@keyframes up{from{opacity:0; transform:translateY(22px);}to{opacity:1; transform:none;}}
@keyframes sheet{from{opacity:0; transform:scale(1.025);}to{opacity:1; transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
.ui{position:fixed; z-index:10; font-family:'Didact Gothic',Arial,sans-serif;}
#nav{bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:8px;}
#nav button{width:8px; height:8px; border-radius:50%; border:1px solid var(--terra); background:transparent; padding:0; cursor:pointer;}
#nav button.on{background:var(--terra);}
.arrow{top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; border:none; background:rgba(23,20,18,.45); color:#EFE9E0; font-size:22px; cursor:pointer;}
#prev{left:14px;} #next{right:14px;}
.top{top:14px; display:flex; gap:8px; right:14px;}
.top a,.top button{background:rgba(23,20,18,.5); border:none; color:#EFE9E0; border-radius:20px; padding:8px 14px; font-size:13px; cursor:pointer; text-decoration:none;}
@media (hover:none){.arrow{display:none;}}
</style>
</head>
<body>
<div id="stage">
<section class="cover"><img class="bg" src="img/01.jpg" alt="Світ десертів: головна візуалізація">
<div class="shade-l"></div>
<p class="eyebrow a1">Chabany Design · дизайн-проєкт інтер'єру</p>
<h1 class="a2">Світ десертів</h1>
<p class="sub a3">кав&#x27;ярня-кондитерська, де десерти в центрі сцени</p><div class="rule a3"></div><p class="facts a4">Луцьк · 2026</p>
<img class="logo a4" src="img/logo-light.png" alt="CHABANY DESIGN"></section>
<section class="sheet"><img class="pg" src="img/02.jpg" alt="Сторінка 2"></section>
<section class="sheet"><img class="pg" src="img/03.jpg" alt="Сторінка 3"></section>
<section class="sheet"><img class="pg" src="img/04.jpg" alt="Сторінка 4"></section>
<section class="sheet"><img class="pg" src="img/05.jpg" alt="Сторінка 5"></section>
<section class="view"><img class="bg" src="img/06.jpg" alt="зала: Оксамит і мармур">
<div class="shade-b"></div><p class="eyebrow a1">зала</p><h2 class="a2">Оксамит і мармур</h2>
<p class="no a3">06</p><img class="logo-s a3" src="img/logo-light.png" alt=""></section>
<section class="view"><img class="bg" src="img/07.jpg" alt="вітрини й бар: Десерти в центрі сцени">
<div class="shade-b"></div><p class="eyebrow a1">вітрини й бар</p><h2 class="a2">Десерти в центрі сцени</h2>
<p class="no a3">07</p><img class="logo-s a3" src="img/logo-light.png" alt=""></section>
<section class="view"><img class="bg" src="img/08.jpg" alt="дзеркальна стіна: Дзеркало з неоном">
<div class="shade-b"></div><p class="eyebrow a1">дзеркальна стіна</p><h2 class="a2">Дзеркало з неоном</h2>
<p class="no a3">08</p><img class="logo-s a3" src="img/logo-light.png" alt=""></section>
<section class="sheet"><img class="pg" src="img/09.jpg" alt="Сторінка 9"></section>
<section class="sheet"><img class="pg" src="img/10.jpg" alt="Сторінка 10"></section>
<section class="sheet"><img class="pg" src="img/11.jpg" alt="Сторінка 11"></section>
<section class="sheet"><img class="pg" src="img/12.jpg" alt="Сторінка 12"></section>
<section class="sheet"><img class="pg" src="img/13.jpg" alt="Сторінка 13"></section>
</div>
<button class="ui arrow" id="prev" aria-label="Попередній слайд">‹</button>
<button class="ui arrow" id="next" aria-label="Наступний слайд">›</button>
<div class="ui top"><a href="Svit-desertiv.pdf" download>PDF</a><button id="fs">На весь екран</button></div>
<div class="ui" id="nav"></div>
<script>
const st=document.getElementById('stage'),S=[...st.children],nav=document.getElementById('nav');let i=0;
S.forEach((s,k)=>{const b=document.createElement('button');b.setAttribute('aria-label','Слайд '+(k+1));b.onclick=e=>{e.stopPropagation();go(k);};nav.appendChild(b);});
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`scale(${k}) translate(-50%,-50%)`;}
function pre(k){const s=S[k];if(s)s.querySelectorAll('img').forEach(im=>{if(!im.complete)im.decode&&im.decode().catch(()=>{});});}
function go(k){i=Math.max(0,Math.min(S.length-1,k));S.forEach((s,n)=>s.classList.toggle('active',n===i));[...nav.children].forEach((b,n)=>b.classList.toggle('on',n===i));history.replaceState(null,'','#'+(i+1));pre(i+1);pre(i+2);}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))go(i+1);if(['ArrowLeft','PageUp'].includes(e.key))go(i-1);});
document.getElementById('next').onclick=()=>go(i+1);document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();};
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)go(i+(d<0?1:-1));x0=null;});
st.addEventListener('click',e=>{go(i+(e.clientX>innerWidth/2?1:-1));});
go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
